[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "targetleak"
version = "0.1.0"
description = "Find data leakage in a training set before it fools you."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "data-leakage", "target-leakage", "machine-learning", "overfitting",
    "data-quality", "model-validation", "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Deliberately just these two. A leak detector that drags in a modelling
    # stack cannot be dropped into someone else's CI without a fight.
    "pandas>=2.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
parquet = ["pyarrow>=10.0"]
dev = ["pytest>=7.0", "pyarrow>=10.0", "scikit-learn>=1.3"]
benchmark = ["scikit-learn>=1.3"]

[project.scripts]
targetleak = "targetleak:main"

[tool.hatch.build.targets.wheel]
packages = ["targetleak"]

[tool.hatch.build.targets.sdist]
include = ["targetleak/", "tests/", "benchmark/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
