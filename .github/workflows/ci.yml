name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims pandas>=2.0 and Python>=3.10, so both ends of that
        # range get tested. pandas 3 changed string columns from 'object' to
        # 'str' dtype, which silently broke date detection once already.
        include:
          - python: "3.10"
            pandas: "pandas>=2.0,<3.0"
          - python: "3.12"
            pandas: "pandas>=2.0,<3.0"
          - python: "3.13"
            pandas: "pandas>=3.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.pandas }}"
          pip install -e ".[dev]"

      - name: Show versions
        run: python -c "import pandas, numpy; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        run: |
          targetleak --demo || test $? -eq 1   # exit 1 is correct: the demo leaks
          targetleak --demo --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['critical']>=1, d"
